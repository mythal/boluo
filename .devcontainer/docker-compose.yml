services:
  workspace:
    image: ghcr.io/mythal/boluo/devcontainer:latest
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      cache_from:
        - ghcr.io/mythal/boluo/devcontainer:latest
    init: true
    command: sleep infinity
    # Numeric forwardPorts only target the workspace container in Codespaces.
    # Sharing MinIO's network namespace makes its ports available there too.
    network_mode: service:storage
    volumes:
      # Compose resolves relative paths from the first file (the repository root).
      - .:/workspaces/boluo:cached
      - type: volume
        source: node_modules
        target: /workspaces/boluo/node_modules
        volume:
          nocopy: true
      - type: volume
        source: cargo_target
        target: /workspaces/boluo/target
        volume:
          nocopy: true
      - type: volume
        source: cargo_cache
        target: /home/vscode/.cargo
        volume:
          nocopy: true
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/boluo?sslmode=disable
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://127.0.0.1:3033
      APP_URL: http://127.0.0.1:3200
      SITE_URL: http://127.0.0.1:3100
      PUBLIC_MEDIA_URL: http://127.0.0.1:9000/boluo
      SECRET: SOME_SECRET
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-boluo}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-boluo-development}
      S3_ENDPOINT_URL: http://storage:9000
      S3_BUCKET_NAME: boluo
      HOST: 0.0.0.0
      RUST_LOG: debug
      DO_NOT_TRACK: 1
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  db:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d boluo']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  node_modules:
  cargo_target:
  cargo_cache:
