[package]
name = "server"
version = "0.1.0"
authors = ["uonr"]
default-run = "server"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "server"
path = "src/server.rs"

[build-dependencies]
dotenvy = "0.15"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
] }
tokio = { version = "1", features = ["rt", "net", "time"] }

[dependencies]
anyhow = "1"
rusty-s3 = { version = "0.10", default-features = false, features = [
  "rustcrypto",
] }
base64 = "0.23.1"
bytes = "1"
compact_str = { version = "0.10", features = ["serde", "sqlx-postgres"] }
time = { version = "0.3", features = ["serde", "serde-human-readable", "parsing", "formatting"] }
clap = { version = "4.4.12", features = ["derive", "env"] }
cookie = "0.18"
dotenvy = "0.15"
futures = "0.3"
foyer = { version = "0.22.3", features = ["serde"] }
hex = "0.4"
ipnet = "2"
itertools = "0.15"
tracing = { version = "0.1", features = ["attributes", "valuable"] }
tracing-appender = "0.2"
percent-encoding = "2.2.0"
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
webpki-roots = "1"
serde_json.workspace = true
serde_urlencoded = "0.7"
url = "2.5"
thiserror = "2.0"
unicode-normalization = "0.1"
tokio-stream = "0.1"
tokio-tungstenite = "0.30.0"
brotli = "8.0.2"
flate2 = "1.1.5"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "time",
  "json",
  "sqlx-toml",
] }
http-body-util = "0.1.2"
hyper-util = { version = "0.1.7", features = ["full"] }
arc-swap = "1.7.1"
quick_cache = { version = "0.7.0", features = ["stats"] }
papaya = "0.2.1"
ahash = "0.8.11"
parking_lot = "0.12.3"
specta.workspace = true
specta-serde.workspace = true
specta-typescript.workspace = true
specta-rust.workspace = true
shared-types = { version = "0.1.0", path = "../shared-types", features = [
  "sqlx",
] }
governor = "0.10.0"
mimalloc = { version = "0.1.49" }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
redis = { version = "1.2.0", features = [
  "streams",
  "ahash",
  "tokio-comp",
  "connection-manager",
] }
redb = { version = "4.1.0", features = ["cache_metrics"] }
smallvec = { version = "1.15.1", features = ["const_generics", "write"] }
tokio-metrics = { version = "0.5.0", features = ["metrics-rs-integration"] }
metrics-exporter-prometheus = "0.18.1"
metrics = "0.24"
sonic-rs = "0.5.8"
sourcemap = "9.3.2"

[dependencies.reqwest]
version = "0.13.2"
default-features = false
features = ["json", "form", "rustls"]

[dependencies.hyper]
version = "1.4.1"
features = ["full"]

[dependencies.serde]
workspace = true

[dependencies.uuid]
version = "1"
features = ["serde", "v1", "v4", "v7"]

[dependencies.tokio]
version = "1"
features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "net",
  "time",
  "process",
  "macros",
  "sync",
  "signal",
  "fs",
  "parking_lot",
]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "time", "fmt", "json", "valuable"]

[dependencies.num-rational]
version = "0.4.2"
features = ["std"]
default-features = false
