[workspace]
resolver = "2"
members = ["crates/*"]
metadata.crane.name = "boluo"

[profile.release]
panic = "abort"

[profile.dev.package.sqlx-macros]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
specta = { version = "=2.0.0-rc.27", features = [
  "time",
  "collect",
  "derive",
  "serde_json",
  "uuid",
] }
specta-serde = "0.0.14"
specta-typescript = "0.0.14"
# Local fork that emits serde attributes for the generated Rust wire types.
specta-rust = { version = "0.0.1", path = "crates/specta-rust" }
