name: Release
on:
  push:
    branches:
      - production
      - master
      # - release-*

concurrency:
  group: release-${{ github.ref }}

env:
  DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'master' && 'staging' || github.ref_name }}
      deployment: false
    outputs:
      deployment_environment: ${{ steps.deployment.outputs.environment }}
      server_required: ${{ steps.server_deployment.outputs.required }}
      site_required: ${{ steps.site_deployment.outputs.required }}
    steps:
      - name: Resolve deployment environment
        id: deployment
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            master) environment=staging ;;
            production) environment=production ;;
            *) echo "Unsupported release branch: $BRANCH_NAME" >&2; exit 1 ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_ENV=$environment" >> "$GITHUB_ENV"

      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nix Setup
        uses: ./.github/actions/nix-setup
        with:
          cache: false

      - name: Check whether server deployment changed
        id: server_deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
        run: >-
          nix develop --quiet --no-update-lock-file .#deployment --command
          python3 scripts/check-server-deployment.py

      - name: Check whether site deployment changed
        if: github.ref_name == 'master'
        id: site_deployment
        env:
          DEPLOYMENT_SERVICE: site
          FLY_API_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
        run: >-
          nix develop --quiet --no-update-lock-file .#deployment --command
          python3 scripts/check-server-deployment.py

  server_image:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
    needs: prepare
    if: needs.prepare.outputs.server_required == 'true'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Nix Setup
        uses: ./.github/actions/nix-setup

      - name: Cache sccache
        uses: actions/cache@v6
        with:
          path: /tmp/sccache
          key: ${{ runner.os }}-sccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Prepare restored sccache
        run: |
          mkdir -p /tmp/sccache
          sudo chown -R "$(id -u):$(id -g)" /tmp/sccache
          chmod -R a+rwX /tmp/sccache

      - name: Push server image
        run: nix run --quiet --no-update-lock-file --print-build-logs ".#push-server-image"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}

      - name: Prepare sccache for caching
        if: ${{ always() }}
        run: |
          if [ -d /tmp/sccache ]; then
            sudo chown -R "$(id -u):$(id -g)" /tmp/sccache
            chmod -R u+rwX,go+rX /tmp/sccache
          fi

  staging_site_image:
    name: Staging site image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
    needs: prepare
    if: >-
      github.ref_name == 'master' &&
      needs.prepare.outputs.site_required == 'true'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Nix Setup
        uses: ./.github/actions/nix-setup

      - name: Push site image
        run: nix run --quiet --no-update-lock-file --print-build-logs ".#push-site-image"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}

  frontend_build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Nix Setup
        uses: ./.github/actions/nix-setup

      - name: Build frontend release
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_package=frontend-release
          if [[ "$BRANCH_NAME" == master ]]; then
            release_package=frontend-release-staging
          fi
          mkdir -p .tmp
          nix build \
            --no-update-lock-file \
            --print-build-logs \
            --max-jobs 1 \
            --out-link .tmp/frontend-build \
            ".#$release_package"

      # GitHub Artifacts reject characters used in OpenNext cache filenames, such as colons.
      - name: Pack frontend build
        run: >-
          tar --create --file .tmp/frontend-build.tar
          --directory .tmp/frontend-build .

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.run_id }}
          path: .tmp/frontend-build.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs:
      - prepare
      - server_image
      - staging_site_image
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.server_required == 'true' &&
      needs.server_image.result == 'success') ||
      (needs.prepare.outputs.server_required == 'false' &&
      needs.server_image.result == 'skipped')) &&
      (github.ref_name == 'production' ||
      (github.ref_name == 'master' &&
      ((needs.prepare.outputs.site_required == 'true' &&
      needs.staging_site_image.result == 'success') ||
      (needs.prepare.outputs.site_required == 'false' &&
      needs.staging_site_image.result == 'skipped'))))
    environment:
      name: ${{ needs.prepare.outputs.deployment_environment }}
      deployment: false
    env:
      DEPLOYMENT_ENV: ${{ needs.prepare.outputs.deployment_environment }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nix Setup
        uses: ./.github/actions/nix-setup
        with:
          cache: false

      - name: Deploy site to staging
        if: >-
          github.ref_name == 'master' &&
          needs.prepare.outputs.site_required == 'true'
        run: nix run --quiet --no-update-lock-file .#deploy-site-staging
        env:
          APP_VERSION: ${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.FLY_IO_TOKEN }}

      - name: Deploy server
        if: needs.prepare.outputs.server_required == 'true'
        run: nix run --quiet --no-update-lock-file ".#deploy-server-${DEPLOYMENT_ENV}"
        env:
          APP_VERSION: ${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.FLY_IO_TOKEN }}

  legacy:
    name: Legacy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs:
      - backend
      - prepare
      - frontend_build
    if: >-
      !cancelled() &&
      needs.backend.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.frontend_build.result == 'success'
    environment:
      name: ${{ needs.prepare.outputs.deployment_environment }}
      deployment: false
    env:
      DEPLOYMENT_ENV: ${{ needs.prepare.outputs.deployment_environment }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Node.js Setup
        uses: ./.github/actions/node-setup

      - name: Download frontend build
        uses: ./.github/actions/download-frontend-build
        with:
          artifact-name: frontend-${{ github.run_id }}

      - name: Upload legacy asset history
        if: github.ref_name == 'production'
        run: |
          node scripts/upload-frontend-assets.ts \
            --assets apps/legacy/dist/assets \
            --bucket boluo-history-files \
            --prefix "${DEPLOYMENT_ENV}/legacy/assets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy legacy
        working-directory: apps/legacy
        run: >-
          node ../../scripts/deploy-cloudflare-worker.ts
          --tag-file ../../.frontend-versions/legacy
          --env "$DEPLOYMENT_ENV"
          --message "Git commit $GITHUB_SHA"
          -- npx wrangler deploy --env "$DEPLOYMENT_ENV"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  spa:
    name: SPA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs:
      - backend
      - prepare
      - frontend_build
    if: >-
      !cancelled() &&
      needs.backend.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.frontend_build.result == 'success'
    environment:
      name: ${{ needs.prepare.outputs.deployment_environment }}
      deployment: false
    env:
      DEPLOYMENT_ENV: ${{ needs.prepare.outputs.deployment_environment }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Node.js Setup
        uses: ./.github/actions/node-setup

      - name: Download frontend build
        uses: ./.github/actions/download-frontend-build
        with:
          artifact-name: frontend-${{ github.run_id }}

      - name: Upload SPA asset history
        if: github.ref_name == 'production'
        run: |
          node scripts/upload-frontend-assets.ts \
            --assets apps/spa/out/_next/static \
            --bucket boluo-history-files \
            --prefix "${DEPLOYMENT_ENV}/spa/_next/static"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy SPA
        working-directory: apps/spa
        run: >-
          node ../../scripts/deploy-cloudflare-worker.ts
          --tag-file ../../.frontend-versions/spa
          --env "$DEPLOYMENT_ENV"
          --message "Git commit $GITHUB_SHA"
          -- npx wrangler deploy --env "$DEPLOYMENT_ENV"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  staging_storybook:
    name: Staging Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
      - frontend_build
    if: >-
      !cancelled() &&
      github.ref_name == 'master' &&
      needs.frontend_build.result == 'success'
    environment:
      name: staging
      deployment: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Node.js Setup
        uses: ./.github/actions/node-setup

      - name: Download frontend build
        uses: ./.github/actions/download-frontend-build
        with:
          artifact-name: frontend-${{ github.run_id }}

      - name: Deploy Storybook
        working-directory: apps/storybook
        run: >-
          node ../../scripts/deploy-cloudflare-worker.ts
          --tag-file ../../.frontend-versions/storybook
          --message "Git commit $GITHUB_SHA"
          -- npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  site:
    name: Site Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
      - backend
      - prepare
      - frontend_build
    if: >-
      !cancelled() &&
      needs.backend.result == 'success' &&
      needs.prepare.result == 'success' &&
      needs.frontend_build.result == 'success'
    environment:
      name: ${{ needs.prepare.outputs.deployment_environment }}
      deployment: false
    env:
      DEPLOYMENT_ENV: ${{ needs.prepare.outputs.deployment_environment }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Node.js Setup
        uses: ./.github/actions/node-setup

      - name: Download frontend build
        uses: ./.github/actions/download-frontend-build
        with:
          artifact-name: frontend-${{ github.run_id }}

      - name: Upload site source maps
        if: github.ref_name == 'production'
        run: |
          node scripts/upload-frontend-assets.ts \
            --assets apps/site/.open-next/assets/_next/static \
            --bucket boluo-history-files \
            --prefix "${DEPLOYMENT_ENV}/site/_next/static"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy site Worker
        working-directory: apps/site
        run: >-
          node ../../scripts/deploy-cloudflare-worker.ts
          --tag-file ../../.frontend-versions/site
          --env "$DEPLOYMENT_ENV"
          --message "Git commit $GITHUB_SHA"
          -- npx @opennextjs/cloudflare deploy --env "$DEPLOYMENT_ENV"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  production_avatar:
    name: Production avatar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.ref_name == 'production'
    environment:
      name: production
      deployment: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Node.js Setup
        uses: ./.github/actions/node-setup

      - name: Deploy avatar Worker to production
        working-directory: apps/avatars
        run: npx wrangler deploy --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  production_grafana:
    name: Production Grafana resources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.ref_name == 'production'
    environment:
      name: production
      deployment: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Node.js Setup
        uses: ./.github/actions/node-setup

      - name: Import Grafana resources
        run: npm run import --workspace=@boluo/grafana -- --yes
        env:
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
